<style>
:root {
  color-scheme: light dark;
  --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eef2ee; --ink:#14282b; --muted:#5c6f70; --line:#d9e1dc;
  --brand:#0f5c63; --brand-ink:#ffffff;
  --ok:#1f7a54; --ok-bg:#dff0e6;
  --warn:#8a5700; --warn-bg:#fbebc8;

}

}
html { scroll-padding-top:env(safe-area-inset-top,0px); }
*, *::before, *::after { box-sizing:inherit; }
body {

  font-family:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

}
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:10; }

button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.wrap { max-width:1080px; margin:0 auto; padding:0 16px 64px; }

header.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:18px 0 10px; }
.title-row { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
h1 { font-size:28px; font-weight:700; }
.sub { color:var(--muted); font-size:13px; }
.who-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.live { display:inline-flex; align-items:center; gap:6px; }
.live i { width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block; }
.live.on i { background:var(--ok); }

.counters { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0 4px; }
.counter { text-align:left; background:var(--surface); border:1px solid var(--line); border-left-width:5px; border-radius:10px; padding:10px 12px; box-shadow:var(--shadow); }
.counter[aria-pressed="true"] { outline:2px solid var(--brand); outline-offset:-2px; }
.counter .n { font-family:"Bricolage Grotesque",sans-serif; font-size:26px; font-weight:700; line-height:1.1; display:block; }
.counter .l { font-size:12.5px; color:var(--muted); }
.counter.c-all { border-left-color:var(--brand); }

.counter.c-rupt { border-left-color:var(--bad); }
.counter.c-exp { border-left-color:var(--exp); }

.toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0; }
.tabs { display:flex; gap:2px; background:var(--surface-2); border-radius:10px; padding:3px; }

.search { flex:1 1 200px; min-width:150px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }

.btn.primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
.btn.danger { color:var(--bad); }

.table { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); }
.row { display:grid; grid-template-columns:minmax(0,2.4fr) minmax(0,1.2fr) 150px minmax(0,1fr) 120px; gap:12px; align-items:center; padding:10px 14px; border-top:1px solid var(--line); }
.row:first-child { border-top:0; }
.row.head { background:var(--surface-2); color:var(--muted); font-size:12.5px; font-weight:600; padding-top:8px; padding-bottom:8px; }
.item-name { font-weight:600; overflow-wrap:anywhere; background:none; border:0; padding:0; text-align:left; }
button.item-name:hover { text-decoration:underline; }
.meta { color:var(--muted); font-size:12.5px; overflow-wrap:anywhere; }

.qty .v small { font-weight:400; color:var(--muted); }
.step { width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-weight:700; line-height:1; }
.chip { display:inline-block; padding:3px 9px; border-radius:99px; font-size:12px; font-weight:600; }
.chip.ok { background:var(--ok-bg); color:var(--ok); }
.chip.bas { background:var(--warn-bg); color:var(--warn); }
.chip.rupture, .chip.perime { background:var(--bad-bg); color:var(--bad); }
.chip.peremption { background:var(--exp-bg); color:var(--exp); }

.catrow { padding:8px 14px; background:var(--surface-2); font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif; font-weight:700; font-size:14px; border-top:1px solid var(--line); }
.crow { display:grid; grid-template-columns:minmax(0,2.4fr) 110px 110px; gap:12px; align-items:center; padding:8px 14px; border-top:1px solid var(--line); }

.crow.chg { background:var(--warn-bg); }
.cin { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); text-align:right; font-size:15px; }
.countbar { display:flex; gap:10px; align-items:center; margin:0 0 10px; flex-wrap:wrap; }
select.btn { max-width:230px; }
.more summary { cursor:pointer; color:var(--brand); font-weight:600; padding:4px 0; }
.more .grid { margin-top:10px; }

.empty { text-align:center; padding:48px 20px; color:var(--muted); }
.empty h2 { color:var(--ink); font-size:20px; margin-bottom:6px; }
.empty .actions { display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap; }

.supplier { background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden; box-shadow:var(--shadow); }
.supplier header { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 14px; background:var(--surface-2); flex-wrap:wrap; }
.supplier h3 { font-size:17px; }
.line { display:grid; grid-template-columns:minmax(0,2fr) 90px 90px 90px; gap:10px; padding:9px 14px; border-top:1px solid var(--line); align-items:center; }
.line .num { text-align:right; font-variant-numeric:tabular-nums; }
.line.head { color:var(--muted); font-size:12.5px; font-weight:600; border-top:0; }

.log { background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
.log-row { display:grid; grid-template-columns:130px minmax(0,1fr) 70px 70px; gap:10px; padding:9px 14px; border-top:1px solid var(--line); align-items:baseline; }
.log-row:first-child { border-top:0; }
.delta.pos { color:var(--ok); font-weight:600; } .delta.neg { color:var(--bad); font-weight:600; }

dialog { border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); padding:0; width:min(560px, calc(100vw - 24px)); max-height:calc(100vh - 24px); }
dialog::backdrop { background:rgba(8,20,22,.55); }
.dlg { padding:18px; display:flex; flex-direction:column; gap:14px; }
.dlg h2 { font-size:20px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid .full { grid-column:1 / -1; }
label.f { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
label.f input { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-size:15px; }
.dlg-actions { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
.dlg-actions .spacer { flex:1; }
.seg { display:flex; gap:6px; }
.seg button { flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--bg); font-weight:600; }
.seg button[aria-pressed="true"] { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }

.banner { background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:10px 12px; margin:10px 0; font-size:14px; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:10px; font-size:14px; z-index:30; max-width:calc(100vw - 32px); }
.hidden { display:none !important; }

#login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.login-card { width:min(380px,100%); background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px; }
.login-card h1 { font-size:26px; }
.login-err { color:var(--bad); font-size:14px; min-height:20px; }

@media (max-width: 760px) {
  .counters { grid-template-columns:repeat(2,1fr); }
  .row.head { display:none; }
  .row { grid-template-columns:1fr auto; grid-template-areas:"name status" "qty qty" "meta meta"; row-gap:8px; }
  .row .c-name { grid-area:name; } .row .c-status { grid-area:status; justify-self:end; }
  .row .c-qty { grid-area:qty; } .row .c-meta { grid-area:meta; }
  .row .c-loc, .row .c-sup { display:none; }
  .line { grid-template-columns:minmax(0,1.6fr) 60px 60px 70px; font-size:14px; }
  .crow { grid-template-columns:minmax(0,1fr) 80px 80px; }
  .log-row { grid-template-columns:1fr 60px; grid-template-areas:"what delta" "who date"; }
  .log-row .c-date { grid-area:date; } .log-row .c-who { grid-area:who; } .log-row .c-what { grid-area:what; } .log-row .c-delta { grid-area:delta; text-align:right; }
  .log-row .c-qtyafter { display:none; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>

<div id="login" class="hidden">
  <div class="login-card">
    <h1>SimSimStock</h1>
    <div class="sub" id="loginHint">Connectez-vous avec votre e-mail et votre mot de passe.</div>
    <label class="f">Adresse e-mail
      <input id="loginEmail" type="email" autocomplete="username" inputmode="email">
    </label>
    <label class="f">Mot de passe
      <input id="loginPw" type="password" autocomplete="current-password">
    </label>
    <div class="login-err" id="loginErr" role="alert"></div>
    <button class="btn primary" id="loginBtn">Se connecter</button>
    <div class="sub">Accès réservé à l'équipe. Pour obtenir un compte, contactez la personne qui gère l'outil.</div>
  </div>
</div>

<div class="wrap hidden" id="app">
  <header class="top">
    <div class="title-row">
      <h1>SimSimStock</h1>
      <div class="who-row">
        <span class="sub live" id="live"><i></i><span id="liveText">Connexion…</span></span>
        <span class="sub" id="who"></span>
        <button class="btn sm" id="logoutBtn">Se déconnecter</button>
      </div>
    </div>
    <div class="sub" id="stockValue"></div>
    <div class="counters" id="counters"></div>
  </header>

  <div id="banner"></div>

  <div class="toolbar">
    <div class="tabs" role="tablist">

    <input type="file" id="importFile" accept=".csv,text/csv,text/plain" class="hidden">

  <main id="content"></main>
</div>

<dialog id="itemDlg">
  <div class="dlg">
    <h2 id="itemTitle">Nouvel article</h2>
    <div class="grid">
      <label class="f full">Nom de l'article
        <input id="f_name" autocomplete="off" placeholder="Ex. Gants nitrile taille M">

      <label class="f full">Catégorie
        <input id="f_category" list="dl_cat" autocomplete="off">
        <datalist id="dl_cat"></datalist>
      </label>
      <label class="f">Quantité en stock
        <input id="f_qty" type="number" min="0" step="any" inputmode="decimal">
      </label>
      <label class="f">Seuil d'alerte
        <input id="f_min" type="number" min="0" step="any" inputmode="decimal">
      </label>
      <details class="full more">
        <summary>Plus de détails (facultatif)</summary>
        <div class="grid">
          <label class="f">Unité
            <input id="f_unit" autocomplete="off" placeholder="boîte, tube, pièce…">
          </label>
          <label class="f">Emplacement
            <input id="f_location" autocomplete="off" placeholder="Ex. Salle 2, armoire B">
          </label>
          <label class="f">Stock cible après commande
            <input id="f_target" type="number" min="0" step="any" inputmode="decimal">
          </label>
          <label class="f">Prix unitaire HT (€)
            <input id="f_price" type="number" min="0" step="any" inputmode="decimal">
          </label>
          <label class="f">N° de lot
            <input id="f_lot" autocomplete="off">
          </label>
          <label class="f">Date de péremption
            <input id="f_expiry" type="date">

        </div>

    </div>
    <div class="dlg-actions">
      <button class="btn danger" id="itemDelete">Supprimer</button>
      <span class="spacer"></span>
      <button class="btn" id="itemCancel">Annuler</button>
      <button class="btn primary" id="itemSave">Enregistrer</button>

</dialog>

<dialog id="adjDlg">
  <div class="dlg">
    <h2 id="adjTitle">Mouvement de stock</h2>

      <label class="f">Quantité

    <div class="dlg-actions">

      <button class="btn primary" id="adjSave">Valider</button>

</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";

  // ---------- état ----------
  var cfg = window.SIMSIM_CONFIG || {};
  var sb = null;          // client Supabase
  var db = null;          // = sb quand l'utilisateur est connecté, sinon null
  var myEmail = "";
  var readOnly = false;
  var items = new Map();
  var logEntries = [];
  var logIds = new Set();
  var channels = [];
  var started = false;
  var state = { tab: "inventaire", filter: "all", q: "", cat: "", editing: null, adjusting: null, adjSign: 1, confirmDelete: false };
  var EXP_DAYS = 60;
  var chain = Promise.resolve();

  // ---------- utilitaires ----------
  function h(tag, props) {
    var e = document.createElement(tag);
    var p = props || {};
    Object.keys(p).forEach(function (k) {
      var v = p[k];
      if (v === false || v == null) return;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) {
        var kid = kids[j];
        if (kid == null || kid === false) continue;
        e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      }
    }
    return e;
  }
  function $(id) { return document.getElementById(id); }
  function fmt(n) {
    n = Number(n) || 0;
    return Number.isInteger(n) ? String(n) : n.toLocaleString("fr-FR", { maximumFractionDigits: 2 });
  }
  function money(n) { return Number(n).toLocaleString("fr-FR", { style: "currency", currency: "EUR" }); }
  function isoToFr(iso) {
    if (!iso) return "";
    var p = String(iso).split("-");
    return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso;
  }
  function daysUntil(iso) {
    if (!iso) return null;
    var p = String(iso).split("-");
    if (p.length !== 3) return null;
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((d - t) / 86400000);
  }
  function toast(msg) {
    var old = document.querySelector(".toast"); if (old) old.remove();
    var t = h("div", { class: "toast", role: "status", text: msg });
    document.body.append(t);
    setTimeout(function () { t.remove(); }, 3500);
  }
  function num(v) {
    var n = parseFloat(String(v).replace(",", "."));
    return isFinite(n) ? n : 0;
  }
  function norm(s) { return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }

  // ---------- correspondance base de données ----------
  function fromRow(r) {
    return {
      id: r.id, name: r.name || "", category: r.category || "", supplier: r.supplier || "", ref: r.ref || "",
      location: r.location || "", unit: r.unit || "", qty: Number(r.qty) || 0, min: Number(r.min) || 0,
      target: Number(r.target) || 0, lot: r.lot || "", expiry: r.expiry || "", price: Number(r.price) || 0
    };
  }
  function toRow(d) {
    return {
      name: d.name, category: d.category || "", supplier: d.supplier || "", ref: d.ref || "",
      location: d.location || "", unit: d.unit || "", qty: d.qty, min: d.min, target: d.target || 0,
      lot: d.lot || "", expiry: d.expiry || null, price: d.price || 0,
      updated_at: new Date().toISOString()
    };
  }
  function check(res) {
    if (res && res.error) throw res.error;
    return res ? res.data : null;
  }

  // ---------- statut ----------
  var STATUS = {
    perime:     { label: "Périmé", rank: 0 },
    rupture:    { label: "Rupture", rank: 1 },
    bas:        { label: "Stock bas", rank: 2 },
    peremption: { label: "Péremption proche", rank: 3 },
    ok:         { label: "OK", rank: 4 }
  };
  function statusOf(it) {
    var d = daysUntil(it.expiry);
    if (d !== null && d < 0) return "perime";
    if ((it.qty || 0) <= 0) return "rupture";
    if ((it.qty || 0) <= (it.min || 0)) return "bas";
    if (d !== null && d <= EXP_DAYS) return "peremption";
    return "ok";
  }

  // ---------- écriture ----------
  function onWriteError(e) {

      return [it.name, it.category, it.supplier, it.ref, it.location, it.qty, it.unit, it.min, it.target, it.lot, isoToFr(it.expiry), it.price].map(csvEscape).join(";");
    });
    var data = "\uFEFF" + [head.join(";")].concat(rows).join("\r\n");
    var name = "stock-cabinet-" + new Date().toISOString().slice(0, 10) + ".csv";
    var blob = new Blob([data], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    toast("Fichier téléchargé.");
  }
  function parseCsv(text) {
    text = text.replace(/^\uFEFF/, "");
    var first = text.split(/\r?\n/)[0] || "";
    var delim = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ";" : ",";
    var rows = [], row = [], cur = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); cur = "";
        if (row.some(function (x) { return x.trim() !== ""; })) rows.push(row);
        row = [];
      } else cur += c;
    }
    row.push(cur);
    if (row.some(function (x) { return x.trim() !== ""; })) rows.push(row);
    return rows;
  }
  var SYN = {
    name: ["article", "nom", "designation", "produit", "libelle"],
    category: ["categorie", "famille", "type"],
    supplier: ["fournisseur"],
    ref: ["reference", "ref", "reference fournisseur"],
    location: ["emplacement", "lieu", "rangement"],
    qty: ["quantite", "qte", "stock", "en stock"],
    unit: ["unite"],
    min: ["seuil", "seuil d'alerte", "minimum", "min", "stock mini"],
    target: ["cible", "stock cible", "maximum", "max"],
    lot: ["lot", "n° de lot", "no de lot", "numero de lot"],
    expiry: ["peremption", "date de peremption", "expiration", "date d'expiration"],
    price: ["prix", "prix ht", "prix unitaire", "prix unitaire ht"]
  };
  function importCsv(text) {
    var rows = parseCsv(text);
    if (rows.length < 2) { toast("Le fichier est vide ou sans en-têtes."); return; }
    var heads = rows[0].map(norm).map(function (s) { return s.trim(); });
    var map = {};
    Object.keys(SYN).forEach(function (f) {
      var idx = heads.findIndex(function (hd) { return SYN[f].indexOf(hd) !== -1; });
      if (idx !== -1) map[f] = idx;
    });
    if (map.name == null) { toast("Colonne « Article » introuvable. Ajoutez-la en première ligne du fichier."); return; }
    var data = rows.slice(1, 201).map(function (r) {
      var get = function (f) { return map[f] != null ? (r[map[f]] || "").trim() : ""; };
      var exp = get("expiry");
      var m = exp.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
      if (m) exp = m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
      if (!/^\d{4}-\d{2}-\d{2}$/.test(exp)) exp = "";
      return {
        name: get("name"), category: get("category"), supplier: get("supplier"), ref: get("ref"),
        location: get("location"), unit: get("unit"), qty: Math.max(0, num(get("qty"))), min: Math.max(0, num(get("min"))),
        target: Math.max(0, num(get("target"))), lot: get("lot"), expiry: exp, price: Math.max(0, num(get("price")))
      };
    }).filter(function (d) { return d.name; });
    if (!data.length) { toast("Aucune ligne exploitable dans le fichier."); return; }
    var skipped = rows.length - 1 > 200 ? " (200 premières lignes seulement)" : "";
    enqueue(function () {
      return sb.from("items").insert(data.map(toRow)).select().then(function (res) {
        (check(res) || []).forEach(function (r) { items.set(r.id, fromRow(r)); });
        render();
        return appendLog({ type: "import", itemId: "", item: "Import CSV", delta: 0, qty: 0, note: data.length + " articles importés" });
      }).then(function () { toast(data.length + " articles importés" + skipped + "."); });
    });
  }

  // ---------- événements ----------
  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () {
      state.tab = t.getAttribute("data-tab");
      if (state.tab !== "inventaire") state.filter = "all";
      syncTabs(); render();
    });
  });
  $("search").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  $("catFilter").addEventListener("change", function (e) { state.cat = e.target.value; render(); });
  $("addBtn").addEventListener("click", function () { openItem(null); });
  $("importBtn").addEventListener("click", function () { $("importFile").click(); });
  $("exportBtn").addEventListener("click", exportCsv);
  $("importFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { importCsv(String(r.result || "")); };
    r.readAsText(f, "utf-8");
    e.target.value = "";
  });
  $("itemCancel").addEventListener("click", function () { $("itemDlg").close(); });
  $("itemSave").addEventListener("click", function () {
    var d = collectItem();
    if (!d.name) { toast("Indiquez le nom de l'article."); $("f_name").focus(); return; }
    saveItem(d, state.editing);
    $("itemDlg").close();
  });
  $("itemDelete").addEventListener("click", function () {
    if (!state.confirmDelete) {
      state.confirmDelete = true;
      $("itemDelete").textContent = "Confirmer la suppression";
      return;
    }
    if (state.editing) deleteItem(state.editing);
    $("itemDlg").close();
  });
  $("itemDlg").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); $("itemSave").click(); }
  });
  $("adjIn").addEventListener("click", function () { state.adjSign = 1; syncSeg(); });
  $("adjOut").addEventListener("click", function () { state.adjSign = -1; syncSeg(); });
  $("adjCancel").addEventListener("click", function () { $("adjDlg").close(); });
  $("adjSave").addEventListener("click", function () {
    var q = num($("adjQty").value);
    if (q <= 0) { toast("Indiquez une quantité supérieure à zéro."); $("adjQty").focus(); return; }
    adjustQty(state.adjusting, state.adjSign * q, $("adjNote").value.trim() || (state.adjSign > 0 ? "Entrée" : "Sortie"));
    $("adjDlg").close();
  });
  $("adjDlg").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); $("adjSave").click(); }
  });

  // ---------- connexion ----------
  function setLive(on, text) {
    $("live").classList.toggle("on", on);
    $("liveText").textContent = text;
  }
  function doLogin() {
    var email = $("loginEmail").value.trim(), pw = $("loginPw").value;
    if (!email || !pw) { $("loginErr").textContent = "Saisissez votre e-mail et votre mot de passe."; return; }
    $("loginBtn").disabled = true; $("loginErr").textContent = "";
    sb.auth.signInWithPassword({ email: email, password: pw }).then(function (res) {
      $("loginBtn").disabled = false;
      if (res.error) { $("loginErr").textContent = "E-mail ou mot de passe incorrect."; return; }
      $("loginPw").value = "";
    }, function () {
      $("loginBtn").disabled = false;
      $("loginErr").textContent = "Connexion impossible. Vérifiez votre accès à internet.";
    });
  }
  $("loginBtn").addEventListener("click", doLogin);
  $("loginPw").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
  $("loginEmail").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
  $("logoutBtn").addEventListener("click", function () { if (sb) sb.auth.signOut(); });

  // ---------- données en direct ----------
  function startData() {
    if (started) return;
    started = true;
    sb.from("items").select("*").limit(5000).then(function (res) {
      var m = new Map();
      (check(res) || []).forEach(function (r) { m.set(r.id, fromRow(r)); });
      items = m; render();
    }).catch(function (e) { onWriteError(e); });
    sb.from("movements").select("*").order("created_at", { ascending: false }).limit(300).then(function (res) {
      var rows = (check(res) || []).slice().reverse();
      logEntries = []; logIds = new Set();
      rows.forEach(addLogRow);
      render();
    }).catch(function () {});
    var ch = sb.channel("simsimstock")
      .on("postgres_changes", { event: "*", schema: "public", table: "items" }, function (p) {
        if (p.eventType === "DELETE") items.delete(p.old.id);
        else items.set(p.new.id, fromRow(p.new));
        render();
      })
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "movements" }, function (p) { addLogRow(p.new); })
      .subscribe(function (status) {
        if (status === "SUBSCRIBED") setLive(true, "Partagé en direct");
        else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") setLive(false, "Connexion perdue");
      });
    channels.push(ch);
  }
  function stopData() {
    channels.forEach(function (c) { try { sb.removeChannel(c); } catch (e) {} });
    channels = []; started = false;
    items = new Map(); logEntries = []; logIds = new Set(); countDraft = {};
  }
  function setSession(s) {
    if (s && s.user) {
      myEmail = s.user.email || "";
      db = sb;
      $("login").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("who").textContent = myEmail;
      startData();
    } else {
      db = null; myEmail = "";
      stopData();
      $("app").classList.add("hidden");
      $("login").classList.remove("hidden");
    }
    render();
  }

  // ---------- démarrage ----------
  var configured = typeof cfg.url === "string" && /^https:\/\//.test(cfg.url) && typeof cfg.key === "string" && cfg.key.length > 20;
  if (!configured || !window.supabase) {
    $("login").classList.remove("hidden");
    $("loginBtn").disabled = true;
    $("loginEmail").disabled = true; $("loginPw").disabled = true;
    $("loginHint").textContent = !configured
      ? "Le site n'est pas encore relié à Supabase. Ouvrez le fichier index.html et remplacez les deux valeurs en haut du fichier (voir le guide LISEZMOI)."
      : "Impossible de charger la bibliothèque de connexion. Vérifiez votre accès à internet.";
    return;
  }
  sb = window.supabase.createClient(cfg.url, cfg.key);
  syncTabs();
  sb.auth.onAuthStateChange(function (_event, session) { setSession(session); });
  sb.auth.getSession().then(function (r) {
    var s = r && r.data ? r.data.session : null;
    if (!s) setSession(null);
  });
})();
</script>
</body>
</html>
